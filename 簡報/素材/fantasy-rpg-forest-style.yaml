usage_notes:
  good_for:
    - "RPG 遊戲關卡背景／找物遊戲場景"
    - "童書、教材封面、自然科『植物的構造』單元插圖（蔬果擬人化）"
    - "桌遊地圖、卡片遊戲場景"
  watch_out:
    - "細節過密時縮圖會糊：小尺寸輸出要減少 props 數量"
